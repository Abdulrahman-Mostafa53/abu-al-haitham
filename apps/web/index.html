<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Abu Al Haitham</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme + language before React loads (prevents a flash) -->
    <script>
      try {
        var d = document.documentElement;
        var th = localStorage.getItem("ah-theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
        var lg = localStorage.getItem("ah-lang") === "ar" ? "ar" : "en";
        d.dataset.theme = th;
        d.lang = lg;
        d.dir = lg === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
